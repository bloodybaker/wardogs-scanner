name: Build scanner
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Offline regression fixtures
        shell: pwsh
        run: |
          dotnet run --project tests/Wardogs.Scanner.Smoke -c Release -- --fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Fixtures failed' }
      - name: Build unsigned candidate
        shell: pwsh
        run: ./build.ps1 -OutputDirectory "$PWD/artifacts/unsigned" -LockedRestore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanner-unsigned
          path: artifacts/unsigned/WardogsScanner.exe
          if-no-files-found: error
